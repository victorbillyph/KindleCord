name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build x64
        run: |
          mkdir -p build
          go build -trimpath -ldflags="-s -w" -o build/kindlecord ./cmd/kindlecord
          ls -lh build/

      - name: Build ARM (Kindle PW3/PW4)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags="-s -w" -o build/kindlecord-arm ./cmd/kindlecord
          ls -lh build/
          file build/kindlecord-arm

      - name: Package Kindle extension
        run: |
          cp build/kindlecord-arm kindlecord
          zip -r build/KindleCord.zip kindlecord bin/ config.xml menu.json README.md data/config.example.json -x "*.git*" "build/*" "data/token.txt"
          rm kindlecord
          ls -lh build/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kindlecord-binaries
          path: |
            build/kindlecord
            build/kindlecord-arm
            build/KindleCord.zip

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/kindlecord
            build/kindlecord-arm
            build/KindleCord.zip
